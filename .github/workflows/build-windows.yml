name: Build Windows

# Construit l'installateur Windows à chaque push sur main (artifact téléchargeable, sans publication).
# Pour publier une version avec mise à jour automatique, utiliser le workflow « Publier une version ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Installation
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tests
        run: npm test
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
      - name: Publier l'installateur comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: savio-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
