name: Build Windows

# Produit l'installateur Windows (Setup.exe) à chaque push sur main (artifact téléchargeable)
# et crée un brouillon de GitHub Release pour chaque tag v*.*.*.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Installation
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tests
        run: npm test
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Savio {0}', github.ref_name) || '' }}
          releaseBody: Installateur Windows de Savio. Voir le CHANGELOG et le README pour les instructions.
          releaseDraft: true
          prerelease: true
      - name: Publier l'installateur comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: savio-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
